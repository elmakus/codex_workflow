name: Fix private.3 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish_private3.yml

permissions:
  contents: write

jobs:
  fix-notes:
    runs-on: ubuntu-latest
    env:
      TAG: v1.1.17-private.3
      SOURCE_SHA: 7187d38a3e0ad1ed445858ff4b2adff6eeae3fd9
      ZIP_SHA: 3e6ad31226dc41a7207154c6cc34d8d18d4824fd3b97a5453e0056c8e1b093a4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare corrected release notes
        run: |
          cp docs/release_notes_1.1.17-private.3.md /tmp/release-notes.md
          printf '\n## Published artifact\n\n' >> /tmp/release-notes.md
          printf -- '- Source commit: `%s`\n' "$SOURCE_SHA" >> /tmp/release-notes.md
          printf -- '- Runtime regression tests: 81 passed\n' >> /tmp/release-notes.md
          printf -- '- Package validation: passed\n' >> /tmp/release-notes.md
          printf -- '- Archive verification: passed\n' >> /tmp/release-notes.md
          printf -- '- Published asset checksum verification: passed\n' >> /tmp/release-notes.md
          printf -- '- ZIP SHA-256: `%s`\n' "$ZIP_SHA" >> /tmp/release-notes.md

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/release-notes.md

      - name: Verify release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets,body
